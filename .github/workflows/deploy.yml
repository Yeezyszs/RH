name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # permite trigger manual

jobs:
  test:
    name: Validar antes do deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm test

  deploy:
    name: Deploy → GitHub Pages
    runs-on: ubuntu-latest
    needs: test  # só faz deploy se os testes passarem

    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read   # para conferir se o artefato já aparece na API

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar artefato de deploy
        run: |
          mkdir -p _site
          # Copia arquivos estáticos necessários
          cp index.html _site/
          cp supabase.js _site/
          cp -r css _site/
          cp -r src _site/
          # Páginas públicas avulsas (não fazem parte do SPA)
          cp sac.html _site/
          cp engajamento.html _site/
          cp privacidade.html _site/
          # Cria 404.html (SPA redirect) — depois das páginas avulsas para não sobrescrevê-las
          cp index.html _site/404.html
          echo "Arquivos prontos para deploy:"
          find _site -type f | sort

      # Troca o marcador ?v=dev pelo hash do commit em todo o artefato. Falha o
      # deploy se nada for substituído, para nunca publicar sem cache-busting.
      - name: Aplicar versão de cache-busting
        run: node scripts/versionar.mjs _site "${{ github.sha }}"

      - name: Upload artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      # O deploy-pages busca o artefato pela API cerca de 0,3s depois do upload.
      # Em 25/11 ele falhou duas vezes seguidas com "Found 0 artifact(s)" — e o
      # log do passo anterior mostrava o upload concluído, com ID e tudo: o
      # artefato existia, só ainda não aparecia na listagem. O deploy quebrava
      # por atraso de indexação do GitHub, e o sistema ficava publicado numa
      # versão antiga sem ninguém perceber (os testes passam, o deploy some).
      #
      # Esperar o artefato aparecer custa segundos e tira essa aresta.
      - name: Esperar o artefato aparecer na API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 15); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                  --jq '[.artifacts[] | select(.name=="github-pages")] | length' || echo 0)
            if [ "${n:-0}" -ge 1 ]; then
              echo "artefato visível na tentativa $i"
              exit 0
            fi
            echo "ainda não listado (tentativa $i); aguardando 4s"
            sleep 4
          done
          echo "::warning::o artefato não apareceu na API em 60s; seguindo mesmo assim"

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
