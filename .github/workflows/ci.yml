name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Rodar testes
        run: npm test

      - name: Coverage report
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      # Reprova o build em erro de lint. A versão anterior deste passo
      # terminava em `|| true` e nunca falhava — passava até com sintaxe
      # inválida. Avisos (no-unused-vars em script clássico) não reprovam.
      - name: ESLint
        run: npm run lint

      - name: Verificar arquivos críticos existem
        run: |
          for f in index.html supabase.js css/style.css src/app.js src/constants.js; do
            if [ ! -f "$f" ]; then
              echo "ERRO: arquivo obrigatório ausente: $f"
              exit 1
            fi
            echo "✓ $f"
          done

  security:
    name: Segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Verificar vulnerabilidades (npm audit)
        run: npm audit --audit-level=high || true

      # Decodifica o payload de cada JWT do repositório e reprova se algum tiver
      # papel diferente de `anon`. A versão anterior era um grep pela palavra
      # "service_role", que errava nos dois sentidos: acusava comentários e
      # NÃO detectava a chave real (o papel fica em base64, dentro do token).
      - name: Verificar chaves privilegiadas no código
        run: node scripts/checar-segredos.mjs .

      - name: Verificar .env não commitado
        run: |
          if git ls-files | grep -E "^\.env$"; then
            echo "ERRO: arquivo .env commitado!"
            exit 1
          fi
          echo "✓ .env não está no repositório"
